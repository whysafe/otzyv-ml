name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Датасет воспроизводится генератором
        run: python data/generate.py && git diff --exit-code data/reviews.csv
      - run: pytest -q
      - name: Обучение и предсказание из CLI
        run: |
          python -m otzyv train
          python -m otzyv predict "Доставили быстро, всё отлично!" "Заработок без вложений, пиши @dohod_1"
